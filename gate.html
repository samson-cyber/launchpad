<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="gate_blocked_during_focus_launchpad">Blocked during focus - LaunchPad</title>
  <!-- [1.2.0 R2 / PLAN C5] Own stylesheet, deliberately NOT newtab.css: this is a
       full page, not a frosted panel over a wallpaper, so the has-bg surface model
       does not apply here. extension_pages CSP forbids inline script and style. -->
  <!-- [H2d] tokens.css FIRST, exactly as newtab.html links it. The v2 token
       set and Space Grotesk's @font-face both live in that file, so one link
       does both jobs; a second copy of either in gate.css is precisely the
       drift [1.9.1] split the token layer out to prevent. It is in build.sh's
       zip allowlist already, so nothing about packaging changes. -->
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="gate.css">
</head>
<body>
  <main class="gate">
    <p data-i18n="gate_focus" class="gate-eyebrow">Focus</p>
    <h1 data-i18n="gate_is_blocked" class="gate-headline"><span id="gate-domain" class="gate-domain"></span> is blocked</h1>
    <!-- [WM.2] THE REASON LINE. Same element, same position, same reserved
         height as the context line it replaces - a user who has seen this page
         before finds the sentence where it has always been. What changed is
         that it now NAMES why the page is blocked instead of describing the
         session and leaving the reason to be inferred. -->
    <p class="gate-context gate-reason" id="gate-context"></p>

    <!-- Both conditional controls start ABSENT and are removed outright rather
         than disabled when they do not apply (the [1.1.4] preview-ghost rule:
         a control that cannot do anything reads as broken, not as locked).
         gate.js removes whichever the worker's answer does not call for. -->
    <div class="gate-actions">
      <button data-i18n="gate_5_more_minutes" type="button" id="gate-snooze" class="gate-btn">5 more minutes</button>
      <button type="button" id="gate-end" class="gate-btn gate-btn-quiet"></button>
      <button data-i18n="gate_continue" type="button" id="gate-continue" class="gate-btn">Go to LaunchPad</button>
    </div>

    <!-- [WM.4] The friction panel. Absent from the flow until a snooze asks for
         it, and it REPLACES the actions row rather than sitting beside it -
         there is one decision in front of the user at a time. -->
    <div class="gate-friction hidden" id="gate-friction">
      <div class="gate-ring-wrap">
        <!-- [H2d] The ring is a conic gradient now rather than an SVG stroke.
             gate.js writes --ring-pct on this element and CSS does the rest;
             aria-hidden because the number beside it is the actual readout. -->
        <div class="gate-ring" id="gate-ring" aria-hidden="true"></div>
        <span class="gate-ring-num" id="gate-ring-num"></span>
      </div>
      <p class="gate-friction-line" id="gate-friction-line" role="status"></p>
      <div class="gate-commit hidden" id="gate-commit">
        <label class="gate-commit-label" for="gate-commit-input" id="gate-commit-label"></label>
        <input type="text" id="gate-commit-input" class="gate-commit-input" autocomplete="off" spellcheck="false">
      </div>
      <div class="gate-actions">
        <button data-i18n="gate_friction_cancel" type="button" id="gate-friction-cancel" class="gate-btn gate-btn-quiet">Never mind</button>
        <button type="button" id="gate-friction-go" class="gate-btn" disabled></button>
      </div>
    </div>

    <p class="gate-footnote" id="gate-footnote"></p>
  </main>
  <script src="i18n.js"></script>
  <script src="locales/en.js"></script>
  <script src="i18n-dom.js"></script>
  <script src="gate.js"></script>
</body>
</html>
