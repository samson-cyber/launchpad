<!doctype html>
<meta charset="utf-8">
<title>compositor</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="c"></canvas>
<script src="https://cdn.jsdelivr.net/npm/webm-muxer@5.0.2/build/webm-muxer.js"></script>
<script>
// OFFLINE compositor: every output frame is drawn, then encoded with an exact
// timestamp (WebCodecs VP9) and muxed into a seekable WebM, so nothing depends
// on rendering keeping up with real time and no frame can drop.
//
// spec = { w, h, fps, bitrate, clips: [{ dir, from, to, ghost?: {x,y,w,h}, zoom?: {s0,s1,cx,cy} }] }
//   dir     = URL of a shot folder holding index.json + frames
//   from/to = ms within the shot
//   ghost   = CSS-px rect of the tile the FIRST held press (the drag) carries
//   zoom    = scale from s0 to s1 across the clip, centred on (cx, cy) CSS px
const SRC_W = 1920, SRC_H = 1080;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");

function cursorPath(x, y, s, down) {
  const k = s * (down ? 0.92 : 1);
  ctx.save(); ctx.translate(x, y); ctx.scale(k, k);
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(0, 20); ctx.lineTo(4.6, 15.6); ctx.lineTo(7.8, 22.6);
  ctx.lineTo(10.8, 21.3); ctx.lineTo(7.7, 14.4); ctx.lineTo(14, 14.4); ctx.closePath();
  ctx.shadowColor = "rgba(0,0,0,0.35)"; ctx.shadowBlur = 4 / k; ctx.shadowOffsetY = 1 / k;
  ctx.fillStyle = "#fff"; ctx.fill();
  ctx.shadowColor = "transparent"; ctx.lineWidth = 1.3; ctx.strokeStyle = "rgba(10,12,20,0.9)"; ctx.stroke();
  ctx.restore();
}
function pointerAt(ptr, t) {
  let i = 0; while (i + 1 < ptr.length && ptr[i + 1].t <= t) i++;
  const a = ptr[i], b = ptr[i + 1];
  if (!b || b.t === a.t) return a;
  const u = Math.max(0, Math.min(1, (t - a.t) / (b.t - a.t)));
  return { x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u, down: a.down };
}
async function loadClip(c) {
  const meta = await (await fetch(c.dir + "/index.json")).json();
  const blobs = await Promise.all(meta.frames.map(async (f) => ({ t: f.t, blob: await (await fetch(c.dir + "/" + f.file)).blob() })));
  return { ...c, meta, blobs };
}
window.render = async function (spec) {
  cv.width = spec.w; cv.height = spec.h;
  const muxer = new WebMMuxer.Muxer({ target: new WebMMuxer.ArrayBufferTarget(), video: { codec: "V_VP9", width: spec.w, height: spec.h, frameRate: spec.fps } });
  let encErr = null;
  const enc = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: (e) => (encErr = String(e)) });
  enc.configure({ codec: "vp09.00.10.08", width: spec.w, height: spec.h, bitrate: spec.bitrate || 8e6, framerate: spec.fps });
  const fms = 1000 / spec.fps;
  let n = 0;
  for (const cs of spec.clips) {
    const c = await loadClip(cs);
    const dur = c.to - c.from, count = Math.round(dur / fms);
    const idxAt = (t) => { let i = 0; while (i + 1 < c.blobs.length && c.blobs[i + 1].t <= t) i++; return i; };
    // The drag window: the first press to the first release after it.
    const p0 = c.meta.pointer.findIndex((p) => p.down);
    const p1 = p0 < 0 ? -1 : c.meta.pointer.findIndex((p, j) => j > p0 && !p.down);
    const dragFrom = p0 < 0 ? Infinity : c.meta.pointer[p0].t, dragTo = p1 < 0 ? -Infinity : c.meta.pointer[p1].t;
    let ghostBmp = null;
    if (c.ghost && p0 >= 0) {
      const src = await createImageBitmap(c.blobs[idxAt(dragFrom - 40)].blob);
      ghostBmp = await createImageBitmap(src, c.ghost.x, c.ghost.y, c.ghost.w, c.ghost.h); src.close();
    }
    let curI = -1, cur = null;
    for (let f = 0; f < count; f++) {
      const t = c.from + f * fms, i = idxAt(t);
      if (i !== curI) { if (cur) cur.close(); cur = await createImageBitmap(c.blobs[i].blob); curI = i; }
      const u = count > 1 ? f / (count - 1) : 0, e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
      const z = c.zoom ? c.zoom.s0 + (c.zoom.s1 - c.zoom.s0) * e : 1;
      const zx = c.zoom ? c.zoom.cx : SRC_W / 2, zy = c.zoom ? c.zoom.cy : SRC_H / 2;
      const sw = SRC_W / z, sh = SRC_H / z;
      const sx = Math.max(0, Math.min(SRC_W - sw, zx - sw / 2)), sy = Math.max(0, Math.min(SRC_H - sh, zy - sh / 2));
      const k = spec.w / sw;
      ctx.drawImage(cur, sx, sy, sw, sh, 0, 0, spec.w, spec.h);
      const p = pointerAt(c.meta.pointer, t);
      const px = (p.x - sx) * k, py = (p.y - sy) * k;
      if (ghostBmp && t >= dragFrom && t < dragTo) {
        const gw = c.ghost.w * k, gh = c.ghost.h * k;
        ctx.save(); ctx.globalAlpha = 0.82; ctx.drawImage(ghostBmp, px - gw * 0.42, py - gh * 0.45, gw, gh); ctx.restore();
      }
      if (c.cursor !== false) cursorPath(px, py, k * 1.1, p.down);
      const vf = new VideoFrame(cv, { timestamp: Math.round(n * fms * 1000), duration: Math.round(fms * 1000) });
      enc.encode(vf, { keyFrame: n % (spec.fps * 2) === 0 }); vf.close();
      n++;
      if (enc.encodeQueueSize > 8) await new Promise((r) => setTimeout(r, 5));
    }
    if (cur) cur.close();
    if (ghostBmp) ghostBmp.close();
  }
  await enc.flush(); enc.close();
  muxer.finalize();
  if (encErr) throw new Error(encErr);
  const buf = new Uint8Array(muxer.target.buffer);
  let s = ""; for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  return { b64: btoa(s), bytes: buf.length, frames: n };
};
</script>
